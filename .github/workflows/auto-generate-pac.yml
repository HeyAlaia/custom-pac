name: Auto Generate PAC File

on:
  schedule:
    - cron: '10 0 * * 4'
  push:
    paths:
      - 'gfw-pac.py'
      - 'pac-template'
      - 'local-tlds.txt'
      - 'direct-domains.txt'
      - 'proxy-domains.txt'
      - 'cidrs-cn.txt'
  workflow_dispatch:

jobs:
  update-gfw-pac:
    runs-on: ubuntu-latest
    permissions:
      actions: write      # dispatch 下游需要
      contents: write     # push 与后续 release 需要

    steps:
      - uses: actions/checkout@v4

      - name: Check if gfw.pac is in the last commit
        id: check
        run: |
          if git show --name-only --pretty=format: HEAD | grep -q '^gfw\.pac$'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the latest cn.txt
        if: steps.check.outputs.needed == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt -o cidrs-cn.txt

      - name: Run gfw-pac.py script
        if: steps.check.outputs.needed == 'true'
        run: ./gfw-pac.py -f gfw.pac -p "PROXY 127.0.0.1:7897" --proxy-domains=proxy-domains.txt --direct-domains=direct-domains.txt --localtld-domains=local-tlds.txt --ip-file=cidrs-cn.txt

      - name: Commit and push changes
        id: commit
        if: steps.check.outputs.needed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          if git diff --cached --quiet; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "工作区无变更，跳过提交"
            exit 0
          fi

          last_msg=$(git log -1 --pretty=%s)   # 只取标题，避免多行
          if [ "${{ github.event_name }}" = "schedule" ]; then
            subject="定期更新数据并生成 gfw.pac"
          else
            subject="自动生成 gfw.pac: ${last_msg}"
          fi

          git commit -m "${subject}"
          git pull --rebase --autostash
          git push
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Auto-Release
        if: steps.check.outputs.needed == 'true' && steps.commit.outputs.generated == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: '.github/workflows/auto-release.yml'
          token: ${{ secrets.GITHUB_TOKEN }}
