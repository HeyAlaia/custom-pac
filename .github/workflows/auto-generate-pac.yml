name: Auto Generate PAC File

on:
  schedule:
    - cron: '10 0 * * 4'          # 每周四 UTC 00:10 = 北京时间 08:10
  push:
    paths:
      - 'gfw-pac.py'
      - 'pac-template'
      - 'local-tlds.txt'
      - 'direct-domains.txt'
      - 'proxy-domains.txt'
      - 'cidrs-cn.txt'
  workflow_dispatch:

jobs:
  update-gfw-pac:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # 只需要读写仓库内容，不再需要 actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if gfw.pac is already in this push
        id: check
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          needed=true
          if [ "${{ github.event_name }}" = "push" ] && \
             echo "$COMMITS_JSON" | grep -qE '"gfw\.pac"'; then
            needed=false
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "本次是否需要重新生成：${needed}"

      - name: Download the latest cn.txt
        if: steps.check.outputs.needed == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt -o cidrs-cn.txt

      - name: Run gfw-pac.py script
        if: steps.check.outputs.needed == 'true'
        run: ./gfw-pac.py -f gfw.pac -p "PROXY 127.0.0.1:7897" --proxy-domains=proxy-domains.txt --direct-domains=direct-domains.txt --localtld-domains=local-tlds.txt --ip-file=cidrs-cn.txt

      - name: Commit and push changes
        if: steps.check.outputs.needed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A
          if git diff --cached --quiet; then
            echo "工作区无变更，跳过提交"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            subject="定期更新数据并生成 gfw.pac"
          else
            subject="自动生成 gfw.pac: $(git log -1 --pretty=%s)"
          fi

          git commit -m "$subject"
          git pull --rebase --autostash
          git push
